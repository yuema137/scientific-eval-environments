name: Knowledge Base Validation

# The deterministic gate for EVERY change to the knowledge base, human PRs included.
#
# Deliberately a separate workflow from daily-knowledge-update.yml. That one carries
# CLAUDE_CODE_OAUTH_TOKEN and can write, so it must never gain a `pull_request` trigger:
# a fork PR would then run untrusted input inside a secret-bearing job. This workflow is
# the mirror image — it is the one that runs on untrusted input, so it holds no secrets,
# asks for `contents: read` only, and executes nothing but repository-local Python.
#
# It also validates the repo WIDE. The daily updater's card and bilingual gates take the
# slug list a single run produced, which is right for a phase gate but means a defect in an
# older card is never looked at again; `cards-all` / `bilingual-all` sweep works/ instead.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes its predecessor; runs on main are never cancelled.
concurrency:
  group: knowledge-base-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the monthly-index check walks main's first-parent history and diffs the
      # PR against its base.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r requirements-dev.txt

      # Every check runs even after an earlier one fails, so one push reports the whole
      # backlog instead of one defect per round trip.
      - name: Search profiles cover the taxonomy
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py profiles

      - name: Axis reverse indexes agree (topics, activities, domains; en + zh)
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py axes

      - name: Derived counts are current
        if: ${{ !cancelled() }}
        run: python scripts/update_counts.py --check

      # A card that reaches main without a row in the month's report breaks validate-all on main
      # and with it the daily updater (2026-10-27). Catch it on the PR instead.
      - name: Monthly reports index every card (validate-all + this PR's cards)
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python scripts/monthly_report.py validate-all
          if [ -n "$BASE_REF" ]; then
            python scripts/monthly_report.py check-pending --base "origin/$BASE_REF"
          fi

      - name: Every card in works/ (template, links, first-appearance stamp)
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py cards-all

      - name: Every card has a conforming Chinese mirror
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py bilingual-all

      - name: Chinese cards use the canonical activity labels
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py zh-activity-labels

      - name: Chinese cards keep the English section headings
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py zh-headings

      - name: Domain Capability Matrices are ranked correctly (en + zh)
        if: ${{ !cancelled() }}
        run: python scripts/update_agent/validators.py matrix-ordering

      # Offline and self-contained: the two live-network cases opt in via RUN_LIVE_SMOKE=1
      # and stay skipped here.
      - name: Deterministic test suite
        if: ${{ !cancelled() }}
        run: python -m pytest tests/ -q
