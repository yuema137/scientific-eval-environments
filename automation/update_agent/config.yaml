# Daily Update Agent — configuration
# All operational knobs live here; code reads this file rather than hard-coding values.

# Overlapping lookback window (days) for discovery. Deduplication — not a hard cutoff —
# prevents repeat additions, so overlap safely absorbs indexing delays and missed runs.
# Fallback window (days) used only OUTSIDE production `full` mode when there is no watermark
# (watermark.window() for non-full callers). A `full` run with an absent watermark fails as
# needs_attention instead; bootstrap it with the workflow_dispatch window_start/window_end override.
lookback_days: 3

# Discovery window is driven by the last SUCCESSFUL production run, not a fixed lookback:
#   window = last_success - overlap_hours  ->  now
# Failed runs never advance the watermark, so the next run catches up automatically. If the backlog
# exceeds max_catchup_days the run fails as needs_attention instead of deep-reviewing hundreds.
# The watermark lives on branch auto/updater-state (watermark.json). It is durable state: never
# delete that branch in a branch cleanup. If it is absent a `full` run fails as needs_attention.
# A manual window override (window_start/window_end) is bounded by max_catchup_days, never advances
# an existing watermark, and seeds an absent one at its window end (bootstrap).
watermark:
  overlap_hours: 72        # re-cover ~3 days before the last success. Different sources use different
                           # "new-work" dates (arXiv submittedDate, OpenReview odate/first-public,
                           # GitHub creation) and each lags differently, so a 3-day cadence searches
                           # the last ~5-6 days. Dedup drops the repeats, so overlap is nearly free.
  max_catchup_days: 60     # beyond this backlog -> needs_attention (no silent truncation); permits recovery from a short outage
  min_interval_hours: 72   # scheduled runs proceed only every ~72h (true cadence, month-independent)

# arXiv discovery uses OAI-PMH incremental harvesting (not the Search API — a ~38-query fan-out
# trips arXiv's request-volume throttle from shared-cloud runners, yielding empty-200 feeds). The
# window is harvested in chunk_days-day chunks, each with its own max_pages budget, under an overall
# max_total_pages budget. One page cap for the whole window used to truncate long windows part-way
# (2026-09/10: a 60-day harvest stopped at datestamp 09-18). A chunk that hits its cap, errors, or is
# skipped for lack of budget marks the source suspicious_empty (incomplete coverage -> watermark not
# advanced) and the report names the last complete day. An empty harvest is suspicious_empty after one
# canary retry; a harvest where every chunk failed is a failure.
arxiv_oai:
  chunk_days: 1          # one OAI datestamp day per chunk
  max_pages: 50          # per chunk; ~1300 records (~4 MB) per page, a datestamp day needs a few pages
  max_total_pages: 300   # whole-run bound (~60-75 pages for a 60-day catch-up; a 6-day run uses ~10)
  # Revision filter. A revised old paper resurfaces with a new datestamp and, on oaipmh.arxiv.org,
  # often a new <created> (2312.10986 showed created=2026-10-23). A record is new work only if its
  # first-submission estimate (the new-style id's YYMM; <created> only when consistent with it) is no
  # older than window start minus revision_grace_days. Older records are dropped from discovery; the
  # ones the local gate would have matched are kept in phase1/arxiv_revisions_dropped.json.
  revision_grace_days: 30

# Per-source result caps in PRODUCTION (full) mode. Keep broad but bounded.
source_limits:
  arxiv: 60          # max results per arXiv query
  openreview: 40     # max notes per OpenReview query
  huggingface: 50    # max papers per HuggingFace term search (the daily feed is unbounded per day)
  github: 30         # max repos per GitHub query

# HuggingFace daily-papers harvest. The curated feed is fetched one calendar day at a time over the
# WHOLE discovery window and memoized per window, so its cost is ~one request per day in the window
# regardless of how many taxonomy items are searched. max_days is only a local guard against a bad
# window fanning out unboundedly, set above the longest valid window (max_catchup_days + overlap).
# If it ever binds, the skipped days are named as a warning in the discovery report (it used to be
# 14 and silently skipped days). Empty days (weekends, holidays) are expected, not a failure.
huggingface:
  max_days: 70

# OpenReview zero-hit canary. /notes/search is relevance-ranked with no server-side date window, so a
# short window can legitimately return nothing (2026-10-27: newest odate in the top-100 was 14 days
# old). Zero records across every query over a window of at least this many days is reported as a
# visible, NON-blocking warning; arXiv remains the primary recency source.
openreview:
  zero_hit_min_window_days: 3

# Per-source query-matrix scope. GitHub is the low-precision, noisy, and rate-limited source
# (search is capped at 30 requests/min), so it runs ONLY the broad global + domain queries — not
# the full topic/activity matrix — and at most one query per item. This bounds its query count
# (~27 instead of ~156), avoiding secondary rate-limit storms, while arXiv/OpenReview stay broad.
source_axes:
  github: [domains]           # + global (always). Skips topics/activities for GitHub.
github_queries_per_item: 1

# Discovery-smoke mode: heavily bounded, one representative axis item per kind.
smoke:
  lookback_days: 30
  per_source_limit: 3
  sample_domains: ["Physics"]
  sample_topics: ["Trajectory Evaluation"]
  sample_activities: ["Simulation & Scientific Computing"]

# Runaway-cost protection (spec §47). If Phase 1 ranks more candidates for deep review than
# max_deep_review_candidates, the top N by confidence are admitted and the rest are written to
# phase1/deferred_by_budget.json (relevance.admit). The overflow is recorded, never silently dropped,
# but it does not fail the run and is not carried into later runs.
limits:
  max_deep_review_candidates: 40
  max_parallel_card_workers: 4
  max_parallel_translation_workers: 4
  max_parallel_review_workers: 4
  max_relevance_workers: 4

# Metadata relevance scorer (Phase-1 triage between dedup and the deep-review cap).
relevance:
  batch_size: 12        # candidates scored per Claude call (cheap; metadata only)

# Bounded retries for transient public-source failures (operational, not semantic).
retry:
  attempts: 3
  backoff_seconds: 5      # exponential: 5, 10, 20

# Claude worker bounds (headless CLI). Model is split by role: deep primary-source work uses the
# strong model; the metadata-only relevance triage (batched, rule-like) uses a fast/cheap model.
claude:
  model: "claude-opus-4-8"                      # deep work: card writing, axis synthesis, translation, review
  # Phase-1 metadata triage. Haiku over-admitted (deep_review 149; tightened prompt -> 112, still ~3x
  # the cap) — the "is evaluation structurally central to measurement or improvement?" judgment is too subtle for Haiku. Sonnet
  # is the right middle tier: far better at that call than Haiku, far cheaper than Opus, and it only
  # reads title/abstract/metadata (no full papers — that is Opus Phase-2 work).
  relevance_model: "claude-sonnet-5"            # metadata-only relevance triage — precision-capable, cheap
  card_worker_max_turns: 40
  axis_worker_max_turns: 40
  axis_worker_batch_size: 10       # Phase-3 slugs per axis-worker call; 38 at once exhausted the turns (2026-10-27)
  translator_max_turns: 30
  reviewer_max_turns: 30
  review_worker_batch_size: 6       # zh pages per reviewer call; ~20 per call exhausted the turns (2026-10-28)
  scorer_max_turns: 6

# Branch / PR strategy: single rolling automated PR (spec §14).
pr:
  branch_prefix: "auto-daily-update"
  rolling_branch: "auto/knowledge-update"     # the one long-lived automated update branch
  title: "Automated knowledge update"
  label: "automated-update"

# HTTP niceties
http:
  user_agent: "scientific-eval-environments-daily-updater (+https://github.com/yuema137/scientific-eval-environments)"
  timeout_seconds: 30
